<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies with {{ actor_name }} - zentrox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-white p-8">

    <div class="mb-8 flex items-center gap-4">
        <a href="javascript:history.back()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded text-sm font-bold border border-gray-600">← BACK</a>
        <h1 class="text-3xl font-black italic border-l-4 border-red-600 pl-4 uppercase">
            Movies Featuring <span class="text-red-500">"{{ actor_name }}"</span>
        </h1>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-6">
        {% for movie in movies %}
        <a href="{% url 'movie_detail' movie.id %}" class="group block">
            <div class="rounded-lg overflow-hidden border border-gray-800 group-hover:border-red-600 transition shadow-lg bg-gray-800">
                <img src="{{ image_base_url }}w342{{ movie.poster_path }}" alt="{{ movie.title }}" class="w-full aspect-[2/3] object-cover group-hover:scale-105 transition duration-300">
            </div>
            <p class="text-sm font-bold mt-3 truncate text-gray-300 group-hover:text-white">{{ movie.title }}</p>
            {% if movie.release_date %}
            <p class="text-[10px] text-gray-500">{{ movie.release_date|slice:":4" }}</p>
            {% endif %}
        </a>
        {% empty %}
        <p class="text-gray-500">No movies found for this actor.</p>
        {% endfor %}
    </div>

</body>
</html>
