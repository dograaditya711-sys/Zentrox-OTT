<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - zentrox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: white; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-[url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d08737b/US-en-20220502-popsignuptwoweeks-perspective_alpha_website_large.jpg')] bg-cover bg-center">

    <div class="absolute inset-0 bg-black/70"></div>

    <div class="relative z-10 w-full max-w-md p-8 md:p-12 bg-black/80 backdrop-blur-md rounded-lg shadow-2xl border border-gray-800">
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold tracking-tighter text-center mb-6"><span class="text-red-600 italic">zentrox</span>.in</h1>
            <h2 class="text-3xl font-bold">Sign In</h2>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <input type="text" name="username" placeholder="Username" required
                    class="w-full bg-[#1f2128] text-white border border-gray-700 rounded px-4 py-4 focus:outline-none focus:border-red-600 transition">
            </div>

            <div>
                <input type="password" name="password" placeholder="Password" required
                    class="w-full bg-[#1f2128] text-white border border-gray-700 rounded px-4 py-4 focus:outline-none focus:border-red-600 transition">
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-4 rounded transition shadow-lg">
                Sign In
            </button>
        </form>

        <div class="mt-10 text-gray-400 text-sm">
            New to zentrox? <a href="{% url 'register' %}" class="text-white hover:text-red-500 font-bold hover:underline">Sign up now.</a>
        </div>
    </div>
</body>
</html>
