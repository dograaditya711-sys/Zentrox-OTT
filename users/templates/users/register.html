<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - zentrox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: white; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-[url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d08737b/US-en-20220502-popsignuptwoweeks-perspective_alpha_website_large.jpg')] bg-cover bg-center">

    <div class="absolute inset-0 bg-black/70"></div>

    <div class="relative z-10 w-full max-w-md p-8 bg-black/80 backdrop-blur-md rounded-lg shadow-2xl border border-gray-800 mt-10">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tighter"><span class="text-red-600 italic">zentrox</span>.in</h1>
            <p class="text-gray-400 mt-2 font-semibold">Join the ultimate streaming club</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            {% for field in form %}
            <div class="flex flex-col">
                <label class="text-sm text-gray-400 font-bold mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded transition shadow-lg mt-6">
                SIGN UP NOW
            </button>
        </form>

        <p class="text-center text-gray-400 mt-6 text-sm">
            Already have an account? <a href="{% url 'login' %}" class="text-white hover:text-red-500 font-bold hover:underline">Sign In</a>
        </p>
    </div>

    <script>
        document.querySelectorAll('input').forEach(input => {
            input.classList.add('w-full', 'bg-[#1f2128]', 'text-white', 'border', 'border-gray-700', 'rounded', 'px-4', 'py-3', 'focus:outline-none', 'focus:border-red-600', 'focus:ring-1', 'focus:ring-red-600', 'transition');
        });
    </script>
</body>
</html>
